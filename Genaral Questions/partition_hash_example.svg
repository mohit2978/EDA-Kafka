<svg viewBox="0 0 820 440" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="mathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="partGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="leadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="cShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg2)" rx="12" />

  <!-- Title -->
  <text x="410" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800" fill="#f8fafc" text-anchor="middle">Step-by-Step Example: "I got Partition 21... What Happens Next?"</text>

  <!-- Step 1: Group ID & Hash Math -->
  <g filter="url(#cShadow)">
    <rect x="35" y="65" width="230" height="150" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="35" y="65" width="230" height="32" rx="10" fill="url(#mathGrad)"/>
    <rect x="35" y="87" width="230" height="10" fill="url(#mathGrad)"/>
    <text x="150" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Step 1: The Hash Math</text>

    <text x="50" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Group ID:</text>
    <text x="50" y="135" font-family="'Consolas', monospace" font-size="12" font-weight="700" fill="#60a5fa">"payment-service"</text>
    
    <text x="50" y="160" font-family="'Consolas', monospace" font-size="11" fill="#cbd5e1">hashCode() = 859,421</text>
    <text x="50" y="180" font-family="'Consolas', monospace" font-size="11" fill="#facc15">859,421 % 50 = </text>
    <text x="160" y="180" font-family="'Consolas', monospace" font-size="14" font-weight="800" fill="#34d399">21</text>
    <text x="50" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Maps to Partition 21</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 265 140 L 300 140" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)" />

  <!-- Step 2: __consumer_offsets Partition 21 -->
  <g filter="url(#cShadow)">
    <rect x="305" y="65" width="230" height="150" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="305" y="65" width="230" height="32" rx="10" fill="url(#partGrad)"/>
    <rect x="305" y="87" width="230" height="10" fill="url(#partGrad)"/>
    <text x="420" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Step 2: Partition 21</text>

    <text x="320" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Target Topic Partition:</text>
    <text x="320" y="136" font-family="'Consolas', monospace" font-size="12" font-weight="700" fill="#c084fc">__consumer_offsets-21</text>
    
    <text x="320" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Replica Set: [3, 4, 1]</text>
    <text x="320" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">In-Sync Replicas: [3, 4, 1]</text>
    <text x="320" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4ade80">Current Leader = Broker 3</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 535 140 L 570 140" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)" />

  <!-- Step 3: Broker 3 is Group Coordinator -->
  <g filter="url(#cShadow)">
    <rect x="575" y="65" width="210" height="150" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="575" y="65" width="210" height="32" rx="10" fill="url(#leadGrad)"/>
    <rect x="575" y="87" width="210" height="10" fill="url(#leadGrad)"/>
    <text x="680" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Step 3: The Coordinator</text>

    <text x="590" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399">Broker 3 is Coordinator!</text>
    <text x="590" y="142" font-family="'Consolas', monospace" font-size="11" fill="#cbd5e1">broker-3:9092</text>
    
    <text x="590" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">The consumer now connects</text>
    <text x="590" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">directly to Broker 3 for all</text>
    <text x="590" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">group-level operations.</text>
  </g>

  <!-- Bottom Detailed Flow Box -->
  <g filter="url(#cShadow)">
    <rect x="35" y="235" width="750" height="185" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="55" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#facc15">What happens after getting Partition 21? (Under the Hood Execution):</text>

    <!-- Point 1 -->
    <text x="55" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#60a5fa">1. Offset Storage:</text>
    <text x="180" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Whenever this consumer group commits an offset, the record is written to <tspan font-family="'Consolas', monospace" fill="#a78bfa">__consumer_offsets-21</tspan> log files on Broker 3.</text>

    <!-- Point 2 -->
    <text x="55" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#60a5fa">2. Heartbeat &amp; Session:</text>
    <text x="210" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">All heartbeat requests from consumers in this group are sent directly to Broker 3 to keep membership alive.</text>

    <!-- Point 3 -->
    <text x="55" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#60a5fa">3. Rebalance Management:</text>
    <text x="225" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Broker 3 coordinates JoinGroup / SyncGroup and tracks generation IDs for this group.</text>

    <!-- Point 4 Failover -->
    <rect x="55" y="365" width="710" height="42" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
    <text x="70" y="383" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f87171">⚡ What if Broker 3 crashes?</text>
    <text x="70" y="399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Controller elects next ISR replica (e.g. Broker 4) as new Leader of Partition 21 ➔ <tspan font-weight="700" fill="#4ade80">Broker 4 automatically becomes the new Coordinator!</tspan></text>
  </g>
</svg>
