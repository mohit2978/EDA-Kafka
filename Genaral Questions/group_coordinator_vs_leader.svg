<svg viewBox="0 0 800 420" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="leaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#090d16" rx="12" />

  <!-- Header Banner -->
  <text x="400" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#f8fafc" text-anchor="middle">Group Coordinator vs. Group Leader (NOT the same!)</text>

  <!-- Column 1: Group Coordinator -->
  <g filter="url(#boxShadow)">
    <rect x="40" y="60" width="340" height="235" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="40" y="60" width="340" height="42" rx="10" fill="url(#coordGrad)"/>
    <rect x="40" y="92" width="340" height="10" fill="url(#coordGrad)"/>
    <text x="210" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Group Coordinator (Broker)</text>

    <!-- Badges / Details -->
    <text x="55" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#60a5fa">Where it lives: <tspan font-weight="400" fill="#cbd5e1">Kafka Server (Broker-side)</tspan></text>
    <text x="55" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#60a5fa">Who it is: <tspan font-weight="400" fill="#cbd5e1">Leader of group's __consumer_offsets partition</tspan></text>
    
    <text x="55" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Key Responsibilities:</text>
    <text x="65" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Manages rebalance lifecycle &amp; group state</text>
    <text x="65" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Receives heartbeats &amp; detects crashed consumers</text>
    <text x="65" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Elects one consumer client as the Group Leader</text>
    <text x="65" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Persists offsets &amp; group metadata to disk</text>
    <text x="65" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Distributes partition assignments to members</text>
  </g>

  <!-- Column 2: Group Leader -->
  <g filter="url(#boxShadow)">
    <rect x="420" y="60" width="340" height="235" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="420" y="60" width="340" height="42" rx="10" fill="url(#leaderGrad)"/>
    <rect x="420" y="92" width="340" height="10" fill="url(#leaderGrad)"/>
    <text x="590" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Group Leader (Consumer)</text>

    <!-- Badges / Details -->
    <text x="435" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399">Where it lives: <tspan font-weight="400" fill="#cbd5e1">App Instance (Client-side)</tspan></text>
    <text x="435" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399">Who it is: <tspan font-weight="400" fill="#cbd5e1">1st consumer instance to join the group</tspan></text>
    
    <text x="435" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Key Responsibilities:</text>
    <text x="445" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Receives list of active members from Coordinator</text>
    <text x="445" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Executes partition assignor (Range / RoundRobin / Sticky)</text>
    <text x="445" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Decides exactly which consumer gets which partition</text>
    <text x="445" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Sends assignment plan back to Coordinator via SyncGroup</text>
    <text x="445" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8">★ Client-side design allows pluggable strategies without broker restarts!</text>
  </g>

  <!-- Bottom Interaction Workflow -->
  <g filter="url(#boxShadow)">
    <rect x="40" y="310" width="720" height="95" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="60" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">How they interact during a Rebalance:</text>
    
    <text x="60" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8"><tspan font-weight="700" fill="#60a5fa">Step 1:</tspan> All consumers send JoinGroup ➔ <tspan fill="#e2e8f0">Group Coordinator (Broker)</tspan> collects them &amp; designates Consumer 1 as <tspan fill="#34d399">Group Leader</tspan>.</text>
    <text x="60" y="373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8"><tspan font-weight="700" fill="#34d399">Step 2:</tspan> <tspan fill="#34d399">Group Leader (Client)</tspan> calculates partition assignments &amp; returns them to <tspan fill="#60a5fa">Group Coordinator</tspan> via SyncGroup.</text>
    <text x="60" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8"><tspan font-weight="700" fill="#60a5fa">Step 3:</tspan> <tspan fill="#60a5fa">Group Coordinator (Broker)</tspan> sends each member their respective partition assignments in response to their SyncGroup requests.</text>
  </g>
</svg>
